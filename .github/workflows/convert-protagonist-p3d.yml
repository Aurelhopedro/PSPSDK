name: Converter protagonista para P3D

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: convert-protagonist-p3d
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Converter OBJ para P3D
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import struct
          from pathlib import Path

          src = Path("assets/characters/protagonist/converted/protagonist.obj")
          out = Path("assets/characters/protagonist/converted/protagonist.p3d")
          report = Path("assets/characters/protagonist/converted/P3D-REPORT.md")
          if not src.is_file():
              raise SystemExit(f"OBJ não encontrado: {src}")

          positions, uvs, normals, triangles = [], [], [], []

          def idx(value, size):
              if not value:
                  return None
              n = int(value)
              n = n - 1 if n > 0 else size + n
              if n < 0 or n >= size:
                  raise ValueError(f"Índice OBJ inválido: {value}")
              return n

          def face_vertex(token):
              p = token.split("/")
              return (idx(p[0], len(positions)),
                      idx(p[1], len(uvs)) if len(p) > 1 else None,
                      idx(p[2], len(normals)) if len(p) > 2 else None)

          for line_no, raw in enumerate(src.read_text(encoding="utf-8", errors="replace").splitlines(), 1):
              s = raw.strip()
              if not s or s.startswith("#"):
                  continue
              p = s.split()
              try:
                  if p[0] == "v" and len(p) >= 4:
                      positions.append(tuple(map(float, p[1:4])))
                  elif p[0] == "vt" and len(p) >= 3:
                      uvs.append(tuple(map(float, p[1:3])))
                  elif p[0] == "vn" and len(p) >= 4:
                      normals.append(tuple(map(float, p[1:4])))
                  elif p[0] == "f" and len(p) >= 4:
                      face = [face_vertex(x) for x in p[1:]]
                      for i in range(1, len(face) - 1):
                          triangles.append((face[0], face[i], face[i + 1]))
              except Exception as e:
                  raise SystemExit(f"Erro na linha {line_no} do OBJ: {e}")

          if not positions or not triangles:
              raise SystemExit("OBJ sem posições ou faces válidas.")

          def sub(a, b):
              return (a[0]-b[0], a[1]-b[1], a[2]-b[2])

          def cross(a, b):
              return (a[1]*b[2]-a[2]*b[1],
                      a[2]*b[0]-a[0]*b[2],
                      a[0]*b[1]-a[1]*b[0])

          def norm(v):
              length = math.sqrt(sum(x*x for x in v))
              return (0.0, 1.0, 0.0) if length < 1e-12 else tuple(x/length for x in v)

          out.parent.mkdir(parents=True, exist_ok=True)
          count = 0
          with out.open("wb") as f:
              f.write(struct.pack("<4sIII", b"AXP3", 1, 0, 32))
              for tri in triangles:
                  p0, p1, p2 = (positions[v[0]] for v in tri)
                  face_normal = norm(cross(sub(p1, p0), sub(p2, p0)))
                  for vi, ti, ni in tri:
                      pos = positions[vi]
                      uv = uvs[ti] if ti is not None else (0.0, 0.0)
                      normal = norm(normals[ni]) if ni is not None else face_normal
                      f.write(struct.pack("<8f", uv[0], uv[1],
                                           *normal, *pos))
                      count += 1
              f.seek(8)
              f.write(struct.pack("<I", count))

          size = out.stat().st_size
          if size != 16 + count * 32:
              raise SystemExit("Validação do tamanho do P3D falhou.")
          with out.open("rb") as f:
              magic, version, stored_count, stride = struct.unpack("<4sIII", f.read(16))
          if (magic, version, stored_count, stride) != (b"AXP3", 1, count, 32):
              raise SystemExit("Validação do cabeçalho P3D falhou.")

          report.write_text(
              "# Relatório de conversão P3D\n\n"
              f"- Origem: `{src}`\n- Saída: `{out}`\n"
              f"- Formato: `AXP3`, versão `{version}`\n"
              f"- Vértices: `{count}`\n- Triângulos: `{len(triangles)}`\n"
              f"- Posições OBJ: `{len(positions)}`\n- UVs OBJ: `{len(uvs)}`\n"
              f"- Normais OBJ: `{len(normals)}`\n- Stride: `{stride} bytes`\n"
              f"- Tamanho: `{size} bytes`\n\n"
              "Cada vértice contém 8 float32: U, V, normalX, normalY, normalZ, "
              "posiçãoX, posiçãoY, posiçãoZ.\n\n"
              "Limitações: formato intermédio personalizado; ainda não existe "
              "carregador PSP. Não preserva esqueleto, pesos de ossos, animações "
              "nem imagens de textura. UVs ausentes recebem zero e normais "
              "ausentes são calculadas por triângulo.\n",
              encoding="utf-8")
          print(f"P3D criado: {out} ({count} vértices, {size} bytes)")
          PY

      - name: Guardar resultado no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/protagonist/converted/protagonist.p3d
          git add assets/characters/protagonist/converted/P3D-REPORT.md
          if git diff --cached --quiet; then
            echo "Não existem alterações para guardar."
            exit 0
          fi
          git commit -m "Convert protagonist OBJ to P3D"
          git push origin HEAD:main

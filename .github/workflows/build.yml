name: Build PSP RPG

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar toolchain PSPSDK
        run: |
          psp-gcc --version
          echo "PSPSDK: $(psp-config --pspsdk-path)"

      - name: Compilar ELF
        run: |
          make
          echo "=== ELF gerado ==="
          ls -lh psp_rpg.elf

      - name: Gerar EBOOT.PBP
        run: |
          echo "=== Gerar PARAM.SFO ==="
          mksfo "PSP RPG 3D" PARAM.SFO

          echo "=== Empacotar EBOOT.PBP ==="
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL psp_rpg.elf NULL

          echo "=== Resultado ==="
          ls -lh EBOOT.PBP PARAM.SFO

      - name: Upload EBOOT.PBP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PSP-RPG-EBOOT
          path: EBOOT.PBP
          retention-days: 30

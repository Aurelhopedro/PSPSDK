name: Build PSP RPG

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar toolchain PSPSDK
        run: |
          echo "=== Localizar pspdev ==="
          which psp-gcc || find / -name "psp-gcc" 2>/dev/null | head -5
          which psp-config || find / -name "psp-config" 2>/dev/null | head -5
          echo "PATH atual: $PATH"
          echo "PSPDEV: ${PSPDEV:-nao definido}"
          psp-gcc --version

      - name: Compilar projeto
        run: |
          # O container pspdev/pspdev já tem o PATH configurado
          echo "=== Iniciando build ==="
          make V=1
          echo "=== Build concluído ==="
          echo "=== Ficheiros gerados ==="
          find . -name "*.pbp" -o -name "*.elf" -o -name "*.prx" 2>/dev/null
          ls -lh

      - name: Verificar e recolher EBOOT.PBP
        run: |
          echo "=== Procurar EBOOT.PBP ==="
          find . -name "EBOOT.PBP" 2>/dev/null
          # O PSPSDK pode gerar na raiz ou em subpasta
          if [ -f "EBOOT.PBP" ]; then
            echo "✅ EBOOT.PBP encontrado na raiz"
            ls -lh EBOOT.PBP
          elif [ -f "build/EBOOT.PBP" ]; then
            echo "✅ EBOOT.PBP encontrado em build/"
            ls -lh build/EBOOT.PBP
            cp build/EBOOT.PBP ./EBOOT.PBP
          else
            echo "❌ EBOOT.PBP não encontrado"
            echo "Listagem completa:"
            ls -la
            exit 1
          fi

      - name: Upload EBOOT.PBP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: PSP-RPG-EBOOT
          path: EBOOT.PBP
          retention-days: 30

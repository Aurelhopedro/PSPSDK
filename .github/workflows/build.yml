name: Build RPG Axel Digital

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar toolchain PSPSDK
        run: |
          psp-gcc --version
          echo "PSPSDK: $(psp-config --pspsdk-path)"

      - name: Compilar ELF
        run: |
          make
          echo "=== ELF gerado ==="
          ls -lh rpg_axel_digital.elf

      - name: Gerar EBOOT.PBP
        run: |
          mksfo "RPG Axel Digital" PARAM.SFO
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL rpg_axel_digital.elf NULL
          echo "=== Artefactos gerados ==="
          ls -lh EBOOT.PBP PARAM.SFO

      - name: Preparar pacote PSP
        run: |
          mkdir -p package/PSP/GAME/RPGAXEL/assets

          cp EBOOT.PBP package/PSP/GAME/RPGAXEL/EBOOT.PBP

          if [ -f "assets/characters/protagonist/converted/protagonist.p3d" ]; then
            cp assets/characters/protagonist/converted/protagonist.p3d \
               package/PSP/GAME/RPGAXEL/assets/protagonist.p3d
          else
            echo "AVISO: protagonist.p3d nao encontrado — pasta assets criada sem o modelo."
            touch package/PSP/GAME/RPGAXEL/assets/.gitkeep
          fi

          echo "=== Conteudo do pacote ==="
          ls -lhR package/PSP/GAME/RPGAXEL/

          echo "=== Validacao ==="
          test -s package/PSP/GAME/RPGAXEL/EBOOT.PBP \
            && echo "EBOOT.PBP: OK" \
            || (echo "ERRO: EBOOT.PBP ausente ou vazio" && exit 1)

          if [ -f "package/PSP/GAME/RPGAXEL/assets/protagonist.p3d" ]; then
            test -s package/PSP/GAME/RPGAXEL/assets/protagonist.p3d \
              && echo "protagonist.p3d: OK" \
              || (echo "ERRO: protagonist.p3d vazio" && exit 1)
          fi

      - name: Upload pacote PSP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Axel-Digital
          path: package/PSP
          retention-days: 30

name: Build RPG Axel Digital

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar toolchain PSPSDK
        run: |
          psp-gcc --version
          echo "PSPSDK: $(psp-config --pspsdk-path)"

      - name: Instalar Python e dependências para o conversor AXS1
        run: |
          # O container pspdev/pspdev é baseado em Alpine Linux
          # Instalar python3, pip e as bibliotecas necessárias
          apk add --no-cache python3 py3-pip 2>/dev/null || \
          (apt-get update -qq && apt-get install -y python3 python3-pip 2>/dev/null) || \
          true
          python3 -m pip install --quiet --break-system-packages pygltflib numpy 2>/dev/null || \
          python3 -m pip install --quiet pygltflib numpy || \
          true
          python3 -c "import pygltflib, numpy; print('pygltflib OK, numpy OK')"

      - name: Converter protagonist.glb → protagonist.axs
        run: |
          GLB="assets/characters/protagonist/source/protagonist.glb"
          AXS="assets/characters/protagonist/converted/protagonist.axs"
          REPORT="assets/characters/protagonist/converted/AXS1-REPORT.md"

          if [ -f "$GLB" ]; then
            echo "=== A converter GLB → AXS1 ==="
            python3 tools/convert_glb_to_axs1.py "$GLB" "$AXS" \
              --report "$REPORT" \
              --fps 30 \
              --max-verts 8192 \
              && echo "AXS1: conversão OK" \
              || echo "[AVISO] Conversão AXS1 falhou — o jogo usará modelo AXP3 como fallback."
          else
            echo "[AVISO] $GLB não encontrado — a ignorar conversão AXS1."
          fi

          # Mostrar resultado
          if [ -f "$AXS" ]; then
            echo "protagonist.axs gerado:"
            ls -lh "$AXS"
          fi
          if [ -f "$REPORT" ]; then
            echo "=== AXS1-REPORT ==="
            cat "$REPORT"
          fi

      - name: Compilar ELF
        run: |
          make
          echo "=== ELF gerado ==="
          ls -lh rpg_axel_digital.elf

      - name: Gerar EBOOT.PBP
        run: |
          mksfo "RPG Axel Digital" PARAM.SFO
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL rpg_axel_digital.elf NULL
          echo "=== Artefactos gerados ==="
          ls -lh EBOOT.PBP PARAM.SFO

      - name: Preparar pacote PSP
        run: |
          mkdir -p package/PSP/GAME/RPGAXEL/assets

          cp EBOOT.PBP package/PSP/GAME/RPGAXEL/EBOOT.PBP

          # Modelo animado AXS1 (prioridade)
          AXS_SRC="assets/characters/protagonist/converted/protagonist.axs"
          if [ -f "$AXS_SRC" ]; then
            cp "$AXS_SRC" package/PSP/GAME/RPGAXEL/assets/protagonist.axs
            echo "protagonist.axs: incluído no pacote"
          else
            echo "AVISO: protagonist.axs ausente — jogo usará fallback AXP3."
          fi

          # Modelo estático AXP3 (fallback)
          P3D_SRC="assets/characters/protagonist/converted/protagonist.p3d"
          if [ -f "$P3D_SRC" ]; then
            cp "$P3D_SRC" package/PSP/GAME/RPGAXEL/assets/protagonist.p3d
            echo "protagonist.p3d: incluído como fallback"
          else
            echo "AVISO: protagonist.p3d não encontrado."
            touch package/PSP/GAME/RPGAXEL/assets/.gitkeep
          fi

          echo "=== Conteudo do pacote ==="
          ls -lhR package/PSP/GAME/RPGAXEL/

          echo "=== Validacao ==="
          test -s package/PSP/GAME/RPGAXEL/EBOOT.PBP \
            && echo "EBOOT.PBP: OK" \
            || (echo "ERRO: EBOOT.PBP ausente ou vazio" && exit 1)

          # Confirmar presença do modelo (axs ou p3d)
          if [ -f "package/PSP/GAME/RPGAXEL/assets/protagonist.axs" ]; then
            echo "protagonista: AXS1 animado"
          elif [ -f "package/PSP/GAME/RPGAXEL/assets/protagonist.p3d" ]; then
            echo "protagonista: AXP3 estático (fallback)"
          else
            echo "AVISO: nenhum modelo do protagonista incluído."
          fi

      - name: Upload pacote PSP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Axel-Digital
          path: package/PSP
          retention-days: 30

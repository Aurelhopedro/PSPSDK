name: Build RPG Axel Digital

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilar EBOOT.PBP
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar toolchain PSPSDK
        run: |
          psp-gcc --version
          echo "PSPSDK: $(psp-config --pspsdk-path)"

      - name: Compilar ELF
        run: |
          make
          echo "=== ELF gerado ==="
          ls -lh rpg_axel_digital.elf

      - name: Gerar EBOOT.PBP
        run: |
          mksfo "RPG Axel Digital" PARAM.SFO
          pack-pbp EBOOT.PBP PARAM.SFO NULL NULL NULL NULL NULL rpg_axel_digital.elf NULL
          echo "=== Artefactos gerados ==="
          ls -lh EBOOT.PBP PARAM.SFO

      - name: Upload EBOOT.PBP como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RPG-Axel-Digital
          path: EBOOT.PBP
          retention-days: 30

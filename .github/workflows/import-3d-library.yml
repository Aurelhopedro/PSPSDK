name: Importar biblioteca 3D do RPG

on:
workflow_dispatch:

permissions:
contents: write

concurrency:
group: import-3d-library
cancel-in-progress: false

jobs:
import-library:
runs-on: ubuntu-latest
steps:
- name: Obter o repositório do jogo
uses: actions/checkout@v4
with:
ref: main

  - name: Preparar pastas
    run: |
      mkdir -p assets/characters/creatures/gobkit
      mkdir -p assets/characters/animals/gobkit
      mkdir -p assets/environment/nature/gobkit
      mkdir -p assets/environment/kenney
      mkdir -p assets/source

  - name: Descarregar fontes fixadas
    run: |
      set -euo pipefail
      mkdir -p /tmp/asset-sources
      curl -fL --retry 3 "https://codeload.github.com/Ariescar/gobkit-free-assets/zip/4e73c68fa6e8ca9d948fcc0ce7215c830a022c3b" -o /tmp/asset-sources/gobkit.zip
      curl -fL --retry 3 "https://codeload.github.com/syuhei176/ai-game-assets/zip/ebfd758dea8db5793c765cc72564efadb36a4ed0" -o /tmp/asset-sources/kenney.zip
      unzip -q /tmp/asset-sources/gobkit.zip -d /tmp/asset-sources/gobkit
      unzip -q /tmp/asset-sources/kenney.zip -d /tmp/asset-sources/kenney

  - name: Importar e validar modelos selecionados
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import hashlib
      import struct

      root = Path.cwd()
      gobkit = next(Path("/tmp/asset-sources/gobkit").glob("gobkit-free-assets-*"))
      kenney = next(Path("/tmp/asset-sources/kenney").glob("ai-game-assets-*"))
      copied = []

      def install(src, dst):
          dst.parent.mkdir(parents=True, exist_ok=True)
          data = src.read_bytes()
          digest = hashlib.sha256(data).hexdigest()

          if dst.exists():
              old = hashlib.sha256(dst.read_bytes()).hexdigest()
              if old != digest:
                  raise SystemExit(f"ABORTADO: ficheiro existente diferente: {dst}")
              return

          dst.write_bytes(data)
          copied.append((str(dst.relative_to(root)), len(data), digest))

      def install_glb(src, dst):
          data = src.read_bytes()

          if len(data) < 12:
              raise SystemExit(f"GLB incompleto: {src}")

          magic, version, declared = struct.unpack("<4sII", data[:12])

          if magic != b"glTF" or version != 2 or declared != len(data):
              raise SystemExit(f"GLB inválido: {src}")

          install(src, dst)

      # 8 criaturas.
      for src in sorted((gobkit / "minion").glob("*.glb")):
          install_glb(src, root / "assets/characters/creatures/gobkit" / src.name)

      # 10 animais animados.
      for src in sorted((gobkit / "animal").glob("*.glb")):
          install_glb(src, root / "assets/characters/animals/gobkit" / src.name)

      for src in sorted((gobkit / "animal").glob("*.png")):
          install(src, root / "assets/characters/animals/gobkit" / src.name)

      # Modelos de natureza.
      for src in sorted((gobkit / "nature").glob("*.glb")):
          install_glb(src, root / "assets/environment/nature/gobkit" / src.name)

      # Preservar licença e documentação originais.
      install(gobkit / "LICENSE", root / "assets/characters/creatures/gobkit/LICENSE.txt")
      install(gobkit / "README.md", root / "assets/characters/creatures/gobkit/UPSTREAM-README.md")
      install(gobkit / "INTEGRATION.md", root / "assets/characters/creatures/gobkit/INTEGRATION.md")

      # Modelos Kenney: árvores, rochas e uma casa.
      source_dir = kenney / "models" / "environment"

      selected = [
          "tree_pine.glb",
          "tree_oak.glb",
          "tree_palm.glb",
          "rock_large.glb",
          "rock_medium.glb",
          "rock_small.glb",
          "building_house.glb"
      ]

      for name in selected:
          src = source_dir / name

          if not src.is_file():
              raise SystemExit(f"Modelo esperado ausente: {name}")

          install_glb(src, root / "assets/environment/kenney" / name)

      source_note = """# Modelos de ambiente Kenney

      Origem: https://github.com/syuhei176/ai-game-assets
      Commit fixado: ebfd758dea8db5793c765cc72564efadb36a4ed0
      Fontes declaradas: Kenney Nature Kit e Kenney City Kit.
      Licença declarada pela fonte: CC0.
      Página do criador: https://kenney.nl

      Importados: 3 árvores, 3 rochas e 1 casa.
      Os GLB ainda precisam de avaliação e otimização para PSP.
      """

      note = root / "assets/environment/kenney/SOURCE.md"

      if not note.exists():
          note.write_text(source_note, encoding="utf-8")

      report = [
          "# Relatório da biblioteca 3D",
          "",
          "Fontes fixadas; nenhum ficheiro do código do jogo foi alterado.",
          "",
          "Gobkit CC0: https://github.com/Ariescar/gobkit-free-assets",
          "Commit: 4e73c68fa6e8ca9d948fcc0ce7215c830a022c3b",
          "Kenney CC0 (conforme declarado pela fonte): https://github.com/syuhei176/ai-game-assets",
          "Commit: ebfd758dea8db5793c765cc72564efadb36a4ed0",
          "",
          "## Ficheiros novos nesta execução"
      ]

      report.extend(
          f"- {path} | {size} bytes | SHA-256: {digest}"
          for path, size, digest in copied
      )

      report += ["", f"Total de ficheiros novos: {len(copied)}"]

      (root / "assets/source/IMPORT-REPORT.md").write_text(
          "\n".join(report) + "\n",
          encoding="utf-8"
      )

      print(f"Importação validada. Ficheiros novos: {len(copied)}")
      PY

  - name: Registar catálogo de fontes e licenças
    run: |
      cat > assets/source/ASSET-SOURCES.md <<'EOF'
      # Catálogo de fontes de recursos 3D

      ## Gobkit — CC0 1.0
      Repositório: https://github.com/Ariescar/gobkit-free-assets
      Commit: 4e73c68fa6e8ca9d948fcc0ce7215c830a022c3b
      Conteúdo: criaturas, animais e modelos de natureza.
      A licença original foi preservada em assets/characters/creatures/gobkit/LICENSE.txt.

      ## Kenney — CC0 conforme declarado pela fonte
      Repositório: https://github.com/syuhei176/ai-game-assets
      Commit: ebfd758dea8db5793c765cc72564efadb36a4ed0
      Conteúdo: árvores, rochas e uma casa.
      A origem e a licença declarada estão em assets/environment/kenney/SOURCE.md.

      ## Limitações
      Os modelos GLB são ficheiros-fonte, não modelos prontos para PSP.
      Esta workflow não converte, não integra no motor e não altera código C/C++.
      Cada modelo deverá ser avaliado e otimizado antes de ser usado no jogo.
      EOF

  - name: Guardar recursos no GitHub
    run: |
      set -euo pipefail

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add assets/characters/creatures/gobkit/
      git add assets/characters/animals/gobkit/
      git add assets/environment/nature/gobkit/
      git add assets/environment/kenney/
      git add assets/source/

      if git diff --cached --quiet; then
        echo "Nenhum recurso novo. A versão já está no repositório."
      else
        git commit -m "assets: importar biblioteca 3D CC0"
        git push origin HEAD:main
      fi
